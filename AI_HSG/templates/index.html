<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Seng Group AI 助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body class="sidebar-open">

<div id="main-layout">
    <div id="sidebar">
        <div class="sidebar-header">
            <button id="new-chat-btn" onclick="newChat()">+ 新对话</button>
        </div>
        <div id="session-list"></div>
        <div class="sidebar-footer">
            <p>Hong Seng Group IT</p>
        </div>
    </div>

    <div id="chat-container">
        <div id="header">
            <div class="menu-toggle" onclick="toggleSidebar()">☰</div>
            <div class="header-title">HONG SENG GROUP AI 助手</div>
            <div style="width: 24px;"></div> 
        </div>
        
        <div id="chat-content">
            <div id="chat-box">
                <div class="welcome-message">
                    <div class="welcome-icon">👋</div>
                    <h2>欢迎使用 Hong Seng Group AI 助手</h2>
                    <p>我是您的专属IT助手，可以帮助您解答关于公司的各种问题</p>
                    <div class="quick-actions">
                        <button class="quick-btn" onclick="quickAsk('IT部门的文档存放在哪里？')">📁 IT文档位置</button>
                        <button class="quick-btn" onclick="quickAsk('介绍一下Hong Seng Group')">🏢 公司介绍</button>
                        <button class="quick-btn" onclick="quickAsk('如何联系IT支持？')">💬 IT支持</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="input-area">
            <div class="bar">
                <input type="text" id="u-in" placeholder="问问 Hong Seng Group AI 助手..." onkeypress="if(event.keyCode==13) send()">
                <button id="send-btn" onclick="send()">
                    <span class="btn-text">发送</span>
                    <span class="btn-icon">→</span>
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentSessionId = null;

    function toggleSidebar() {
        document.body.classList.toggle('sidebar-closed');
    }

    async function loadSessions() {
        const res = await fetch('/get_sessions');
        const data = await res.json();
        const list = document.getElementById('session-list');
        list.innerHTML = data.map(s => `
            <div class="session-item ${currentSessionId == s.id ? 'active' : ''}" onclick="switchChat('${s.id}')">
                <span class="chat-icon">💬</span>
                <span class="session-title">${s.title}</span>
                <button class="delete-btn" onclick="deleteSession(event, '${s.id}')" title="删除对话">🗑️</button>
            </div>
        `).join('');
    }

    function newChat() {
        currentSessionId = null;
        document.getElementById('chat-box').innerHTML = `
            <div class="welcome-message">
                <div class="welcome-icon">👋</div>
                <h2>欢迎使用 Hong Seng Group AI 助手</h2>
                <p>我是您的专属IT助手，可以帮助您解答关于公司的各种问题</p>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="quickAsk('IT部门的文档存放在哪里？')">📁 IT文档位置</button>
                    <button class="quick-btn" onclick="quickAsk('介绍一下Hong Seng Group')">🏢 公司介绍</button>
                    <button class="quick-btn" onclick="quickAsk('如何联系IT支持？')">💬 IT支持</button>
                </div>
            </div>
        `;
        loadSessions();
    }

    function quickAsk(question) {
        document.getElementById('u-in').value = question;
        send();
    }

    async function switchChat(id) {
        currentSessionId = id;
        const res = await fetch(`/get_messages/${id}`);
        const msgs = await res.json();
        const box = document.getElementById('chat-box');
        box.innerHTML = msgs.map(m => `
            <div class="${m.role}-row">
                ${m.role === 'assistant' ? '<div class="ai-icon">🤖</div>' : ''}
                <div class="${m.role}-content">${marked.parse(m.content)}</div>
            </div>
        `).join('');
        loadSessions();
    }

    async function send() {
        const input = document.getElementById('u-in');
        const box = document.getElementById('chat-box');
        const val = input.value.trim();
        if(!val) return;

        // 移除欢迎消息
        const welcomeMsg = box.querySelector('.welcome-message');
        if (welcomeMsg) {
            welcomeMsg.remove();
        }

        box.innerHTML += `<div class="user-row"><div class="user-content">${escapeHtml(val)}</div></div>`;
        input.value = '';

        const aiRow = document.createElement('div');
        aiRow.className = 'ai-row';
        aiRow.innerHTML = `<div class="ai-icon">🤖</div><div class="ai-content"><span class="typing-indicator">正在思考中...</span></div>`;
        box.appendChild(aiRow);
        const aiContent = aiRow.querySelector('.ai-content');
        
        const chatContent = document.getElementById('chat-content');
        chatContent.scrollTop = chatContent.scrollHeight;

        const res = await fetch('/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: val, session_id: currentSessionId})
        });

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let currentText = "";

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = JSON.parse(line.substring(6));
                    currentText += data.token;
                    aiContent.innerHTML = marked.parse(currentText);
                    chatContent.scrollTop = chatContent.scrollHeight;
                    
                    if (!currentSessionId) {
                        currentSessionId = data.session_id;
                        loadSessions();
                    }
                }
            }
        }
    }

    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.replace(/[&<>"']/g, m => map[m]);
    }

    async function deleteSession(event, sessionId) {
        event.stopPropagation(); // 防止触发 switchChat
        
        if (!confirm('确定要删除这个对话吗？')) {
            return;
        }
        
        try {
            const res = await fetch(`/delete_session/${sessionId}`, {
                method: 'DELETE'
            });
            const result = await res.json();
            
            if (result.success) {
                // 如果删除的是当前对话，切换到新对话
                if (currentSessionId === sessionId) {
                    newChat();
                } else {
                    loadSessions();
                }
            } else {
                alert('删除失败: ' + result.message);
            }
        } catch (error) {
            console.error('删除错误:', error);
            alert('删除失败，请重试');
        }
    }

    window.onload = loadSessions;
</script>

<style>
    /* 欢迎消息样式 */
    .welcome-message {
        text-align: center;
        padding: 60px 20px;
        max-width: 600px;
        margin: 40px auto;
        animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .welcome-icon {
        font-size: 64px;
        margin-bottom: 20px;
        animation: wave 2s ease-in-out infinite;
    }

    @keyframes wave {
        0%, 100% { transform: rotate(0deg); }
        25% { transform: rotate(20deg); }
        75% { transform: rotate(-20deg); }
    }

    .welcome-message h2 {
        color: var(--accent-blue);
        margin-bottom: 12px;
        font-size: 24px;
    }

    .welcome-message p {
        color: #aaa;
        margin-bottom: 30px;
        font-size: 16px;
    }

    .quick-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .quick-btn {
        padding: 12px 20px;
        background: var(--card-bg);
        border: 1px solid rgba(0, 212, 255, 0.3);
        border-radius: 12px;
        color: #ddd;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 14px;
    }

    .quick-btn:hover {
        background: rgba(0, 212, 255, 0.15);
        border-color: rgba(0, 212, 255, 0.6);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 212, 255, 0.3);
    }

    /* 打字指示器 */
    .typing-indicator {
        color: #888;
        font-style: italic;
    }

    .typing-indicator::after {
        content: '...';
        animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
        0%, 20% { content: '.'; }
        40% { content: '..'; }
        60%, 100% { content: '...'; }
    }

    /* 按钮样式增强 */
    #send-btn {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .btn-icon {
        font-size: 18px;
        transition: transform 0.3s ease;
    }

    #send-btn:hover .btn-icon {
        transform: translateX(4px);
    }

    /* 删除按钮样式 */
    .delete-btn {
        opacity: 0;
        background: rgba(255, 59, 48, 0.2);
        border: 1px solid rgba(255, 59, 48, 0.4);
        color: #ff3b30;
        padding: 4px 8px;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 14px;
        margin-left: auto;
    }

    .session-item:hover .delete-btn {
        opacity: 1;
    }

    .delete-btn:hover {
        background: rgba(255, 59, 48, 0.3);
        border-color: rgba(255, 59, 48, 0.6);
        transform: scale(1.1);
    }

    .delete-btn:active {
        transform: scale(0.95);
    }
</style>

</body>
</html>
